[options]
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
http_port = 8069
list_db = True
proxy_mode = False
without_demo = all
data_dir = /var/lib/odoo
# Enterprise source first (when running via odoo-bin from /opt/odoo19e).
# Image fallback addons also listed.
addons_path = /opt/odoo19e/odoo/addons,/opt/odoo19e/addons,/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
logfile = /var/lib/odoo/odoo.log
