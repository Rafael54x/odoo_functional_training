# Odoo 19 Enterprise — odoo19e
# Host: odoodev2 (172.16.2.123) · UI: http://172.16.2.123:8070
#
# Layout host (sudah ada):
#   /opt/odoo/community   ← Odoo core + community addons
#   /opt/odoo/enterprise  ← Enterprise addons (isi dulu jika kosong)
#
# Start di odoodev2:
#   cd ~/odoo19e && bash scripts/start-on-odoodev2.sh

name: odoo19e

services:
  db:
    image: postgres:16-alpine
    container_name: odoo19e-db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo19e-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odoo19e
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8070:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      ODOO_COMMUNITY: /opt/odoo/community
      ODOO_ENTERPRISE: /opt/odoo/enterprise
    volumes:
      - /opt/odoo/community:/opt/odoo/community:ro
      - /opt/odoo/enterprise:/opt/odoo/enterprise:ro
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo19e-data:/var/lib/odoo
      - odoo19e-extra:/mnt/extra-addons
    restart: unless-stopped

volumes:
  odoo19e-db:
  odoo19e-data:
  odoo19e-extra:
